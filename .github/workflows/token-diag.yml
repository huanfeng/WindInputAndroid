name: token-diag
# 临时诊断:GITHUB_TOKEN 对本仓 git fetch 报 Repository not found,测 token 视角的
# git 访问与 API 访问,区分 token 问题还是仓库问题。诊断完删除本文件。
on: workflow_dispatch

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 事件上下文里的仓库标识
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "github.repository      = [${{ github.repository }}]"
          echo "github.repositoryId    = [${{ github.repositoryId }}]"
          echo "github.repository_owner = [${{ github.owner }] [${{ github.repository_owner }}]"
          echo "github.event.pull_request.repository = [${{ github.event.pull_request.repository }}]"
          echo "github.event 里的 repo 字段 ="
          echo '${{ toJson(github.event) }}' | head -40
          echo "== 用 github.repository 的值直接 ls-remote(复现 checkout 的 URL 拼接)=="
          git ls-remote "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" HEAD 2>&1 | head -3
          echo "== 对照:硬编码正确 URL =="
          git ls-remote https://x-access-token:$GH_TOKEN@github.com/huanfeng/WindInputAndroid.git HEAD 2>&1 | head -3
