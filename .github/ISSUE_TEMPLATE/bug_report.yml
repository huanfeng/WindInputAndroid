name: Bug 反馈
description: 报告一个 Bug 帮助我们改进
labels: ["缺陷"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交 Bug 反馈！请尽量详细描述。

        > ### 📋 输入相关的问题，请附上诊断压缩包
        > 一份诊断能省掉十轮来回。**抓取方式：**
        > 1. 能稳定复现的：先复现一次问题
        > 2. 打开 **设置 → 关于 → 导出诊断压缩包**（或「分享诊断信息」），把生成的 zip 拖进下方「截图、录屏或诊断压缩包」
        > 3. 偶发问题请写清楚**出问题的时间点**，并尽快导出
        >
        > ⚠️ 诊断含按键与候选统计、运行日志，不含你输入的文字；发之前仍请自查。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 切换到清风输入法
        2. 打开某某应用
        3. 输入 '...'
        4. 出现异常
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 输入法版本
      description: 设置 → 关于
      placeholder: "0.5.4"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 机型与系统
      description: 品牌、型号、Android 版本、厂商 ROM（如 HyperOS 2 / One UI 7）
      placeholder: "Xiaomi 14 / Android 15 / HyperOS 2"
    validations:
      required: true

  - type: dropdown
    id: nav
    attributes:
      label: 导航方式
      options:
        - 三键导航
        - 手势导航
        - 不确定
    validations:
      required: false

  - type: dropdown
    id: schema
    attributes:
      label: 当前输入方案
      options:
        - 五笔 86
        - 全拼
        - 双拼
        - 笔画
        - 其他（请在描述中说明）
    validations:
      required: false

  - type: textarea
    id: app
    attributes:
      label: 出现问题的应用
      placeholder: 微信 / 浏览器 / ……

  - type: input
    id: occurred-at
    attributes:
      label: 问题发生的时间点
      description: 精确到分钟，日志里靠它定位。偶发问题尤其必填
      placeholder: "2026-11-12 14:32 左右"

  - type: textarea
    id: screenshots
    attributes:
      label: 截图、录屏或诊断压缩包
      description: 把「设置 → 关于 → 导出诊断压缩包」生成的 zip 拖到这里
