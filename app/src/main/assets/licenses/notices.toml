# 「开源许可」页的条目。随包分发的每一份第三方数据与程序库都要在这里有一条。
#
# [[notice]]
#   group    分组：核心 / 词库与数据 / 程序库
#   name     名称
#   usage    在本输入法里用来做什么
#   license  许可证；有全文的写 licenses/ 下的文件名去掉 .txt（GPL-3.0 / LGPL-3.0 /
#            Apache-2.0 / MIT / MPL-2.0），点开显示全文
#   url      来源
#
# 数据条目的来源与加工方式以主仓 WindInput/NOTICE.md 为准；往 assets/data 里加了新数据，
# 先去那边找它的条目，再抄到这里。Rust 依赖不逐条手写，见 scripts/gen-rust-licenses.sh。

