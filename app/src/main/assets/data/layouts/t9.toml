# 九宫格拼音（拼音方案在设置里开了九宫格时代替字母层；语法说明见 qwerty.toml）
#
# 形态同数字键盘：左列前三行是占位空白，视图在那里画可上下滚动的标点列。
# `keypad` 是上报给核心的编码键字符（2-9；分词键是 '），进编码缓冲，不是数字；
# `swipe_up` 是上滑出的真数字（原样上屏，有编码时先顶首选）。
# 键面的字母只是提示：哪个键代表哪些字母由引擎的键面映射决定。

[meta]
id = "t9"
name = "九宫格拼音"

[[rows]]
key = [
  { spacer = 1 },
  { keypad = "'", label = "分词", swipe_up = "1", width = 1.4 },
  { keypad = "2", label = "ABC", swipe_up = "2", width = 1.4 },
  { keypad = "3", label = "DEF", swipe_up = "3", width = 1.4 },
  { label = "⌫", action = "backspace" },
]

[[rows]]
key = [
  { spacer = 1 },
  { keypad = "4", label = "GHI", swipe_up = "4", width = 1.4 },
  { keypad = "5", label = "JKL", swipe_up = "5", width = 1.4 },
  { keypad = "6", label = "MNO", swipe_up = "6", width = 1.4 },
  { label = "重输", action = "clear_input" },
]

[[rows]]
key = [
  { spacer = 1 },
  { keypad = "7", label = "PQRS", swipe_up = "7", width = 1.4 },
  { keypad = "8", label = "TUV", swipe_up = "8", width = 1.4 },
  { keypad = "9", label = "WXYZ", swipe_up = "9", width = 1.4 },
  { label = "换行", action = "enter" },
]

[[rows]]
key = [
  { label = "符号", action = "symbol_page" },
  { label = "123", action = "switch_symbols", width = 1.4 },
  { label = "空格", action = "space", width = 2.8 },
  { label = "中英", action = "switch_lang" },
]
