# 符号/数字层布局（语法说明见 qwerty.toml）

[meta]
id = "symbols"
name = "符号"

[[rows]]
keys = "1234567890"

[[rows]]
keys = "@#%&*-+=()"

[[rows]]
key = [
  { label = "~", text = "~", width = 1.5 },
  { chars = "!?:;/'\"" },
  { label = "⌫", action = "backspace", width = 1.5 },
]

[[rows]]
key = [
  { label = "ABC", action = "switch_symbols", width = 1.5 },
  { label = "，", text = "，" },
  { label = "空格", action = "space", width = 3.4 },
  { label = "。", text = "。" },
  # 符号层也留中英键：否则切进符号层就没法切中英，得先切回字母层
  { label = "中", action = "switch_lang", width = 1.3 },
  { label = "⏎", action = "enter", width = 1.5 },
]
