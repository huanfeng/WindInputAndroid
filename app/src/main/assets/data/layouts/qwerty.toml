# 键盘布局定义（TOML，与配置文件家族格式统一）
#
# 语法：
#   [meta]           id/name
#   [[rows]]         每行一个；二选一：
#     keys = "..."   简写：每字符展开为一个字符键
#     swipe = "..."  简写行可选：位置对齐的上滑副字符（非字母键兼作长按气泡；
#                    字母键的长按气泡固定是「小写 / 大写」）
#     key  = [ {..} ] 显式键位数组，字段：
#       spacer     占位空白的宽度权重（不绘制，触点归最近的键），如 { spacer = 0.5 }
#       label      显示文本（text/chars 键可省略，缺省用字符本身）
#       text       字符键的输出字符（经引擎：中文模式下标点转中文形态、有编码时数字选词）
#       commit     原样上屏的文本，不经引擎（数字键盘、123 层的半角句点）
#       chars      简写：连续字符批量展开
#       action     功能键：shift | backspace | enter | space | switch_symbols | switch_lang
#                  switch_lang 键面同时写「中」「英」，当前模式高亮；长按开快捷面板
#                  emoji 打开表情面板；symbol_page 分类符号页；number_pad 九宫格数字键盘
#       accent     true = 强调色键面（123 层、数字键盘的返回键）
#       row_span   纵向占几行（缺省 1）；下一行同一位置放等宽 spacer
#       width      相对宽度权重，缺省 1.0
#       swipe_up   上滑输出的副字符
#       long_press 长按气泡字符集（每字符一项，横移选择）
#       en_text    英文模式下改输出的字符（如逗号句号合一键：中文逗号、英文句点）
#       en_swipe_up 英文模式下的上滑字符
#
# 覆盖解析：filesDir/user/layouts/qwerty.toml > filesDir/data/layouts/qwerty.toml > 内置。

[meta]
id = "qwerty"
name = "26 键"

[[rows]]
keys = "qwertyuiop"
swipe = "1234567890"

[[rows]]
# 第 2 行两侧各缩进半个键，键宽与第 1 行相同（大众布局）
key = [
  { spacer = 0.5 },
  { chars = "asdfghjkl", swipe = "@#$%&-+()" },
  { spacer = 0.5 },
]

[[rows]]
key = [
  { label = "⇧", action = "shift", width = 1.5 },
  { chars = "zxcvbnm", swipe = "*\"':;!?" },
  { label = "⌫", action = "backspace", width = 1.5 },
]

[[rows]]
# 大众布局（豆包 / 微信，见 docs/android-ime-features.md §14.1），总权重 10 与字母行对齐：
# 123(2) · 逗号句号合一(1) · 空格(4) · 中英(1) · 回车(2)。
# 标点一律写 ASCII：中英形态由模式决定（KeyboardView 显示 / 引擎输出），布局只说「这是逗号」。
# 回车的文字随输入框变（发送 / 搜索…），这里的 label 是多行框的缺省「换行」。
key = [
  { label = "123", action = "switch_symbols", width = 2 },
  { text = ",", swipe_up = ".", long_press = ".,?!:;", en_text = ".", en_swipe_up = "'" },
  { label = "空格", action = "space", width = 4 },
  # 中英切换固定在回车左侧（主流输入法的位置约定，肌肉记忆在这）
  { label = "中英", action = "switch_lang" },
  { label = "换行", action = "enter", width = 2 },
]
