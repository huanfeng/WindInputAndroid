# 键盘布局定义（TOML，与配置文件家族格式统一）
#
# 语法：
#   [meta]           id/name
#   [[rows]]         每行一个；二选一：
#     keys = "..."   简写：每字符展开为一个字符键
#     swipe = "..."  简写行可选：位置对齐的上滑副字符（兼作长按气泡）
#     key  = [ {..} ] 显式键位数组，字段：
#       label      显示文本（text/chars 键可省略，缺省用字符本身）
#       text       字符键的输出字符
#       chars      简写：连续字符批量展开
#       action     功能键：shift | backspace | enter | space | switch_symbols | switch_lang
#                  switch_lang 的键面显示当前模式（中/英），长按开快捷面板
#                  emoji 打开表情面板
#       width      相对宽度权重，缺省 1.0
#       swipe_up   上滑输出的副字符
#       long_press 长按气泡字符集（每字符一项，横移选择）
#
# 覆盖解析：filesDir/user/layouts/qwerty.toml > filesDir/data/layouts/qwerty.toml > 内置。

[meta]
id = "qwerty"
name = "26 键"

[[rows]]
keys = "qwertyuiop"
swipe = "1234567890"

[[rows]]
keys = "asdfghjkl"
swipe = "@#$%&-+()"

[[rows]]
key = [
  { label = "⇧", action = "shift", width = 1.5 },
  { chars = "zxcvbnm", swipe = "*\"':;!?" },
  { label = "⌫", action = "backspace", width = 1.5 },
]

[[rows]]
# 标点一律写 ASCII：中英形态由模式决定（KeyboardView 显示 / 引擎输出），布局只说「这是逗号」。
# 两侧权重对称（1.3+1+1 = 1+1+1.3），空格居中；表情键既是主流位置也是配重。
key = [
  { label = "?123", action = "switch_symbols", width = 1.3 },
  { label = "☺", action = "emoji" },
  { text = ",", long_press = "\\!?:;" },
  { label = "空格", action = "space", width = 3.4 },
  { text = ".", long_press = "^~`_%" },
  # 中英切换固定在回车左侧（主流输入法的位置约定，肌肉记忆在这）
  { label = "中", action = "switch_lang" },
  { label = "⏎", action = "enter", width = 1.3 },
]
