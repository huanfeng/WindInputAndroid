# 安卓设置清单：驱动设置页生成（结构与取舍见 docs/mobile-ux-reference.md §6）。
#
# [[page]]   一级页面（首页的一行）
#   id       页面标识；schema / stats / about 另有代码画的专属区块
#   title    标题
#   segment  首页分段：shared（与电脑版相同）/ android（手机键盘）/ tail（收尾）
#
# [[item]]   设置项，按出现顺序归入 page → section（卡片）
#   page     所属页面 id
#   section  卡片名。共用项照抄电脑版清单（wind-setting/src/assets/settings_manifest.toml）
#   key      配置键（点分路径）
#   source   engine = 引擎配置（经核心 config_set 写进核心用户层，键须在核心注册表里）
#            android = 键盘自己的配置（filesDir/user/config.toml，只有 K 侧读）
#   type     toggle / select / int
#   title    标题。共用项照抄电脑版的 label；键盘专属项写看得见的行为
#   summary  说明（可选）
#   default  默认值（仅 android 项；引擎项的当前值与默认值都来自核心）
#   options  select 的选项 [{ value, label }]；value 一律写字符串，写入时按键的类型转换
#   min / max / step / unit   int 的范围、步长、单位
#   advanced true = 收进卡片底部的「进阶」折叠区（工程参数）
#
# 引擎项写入后会发 ReloadConfig 让核心即时重读；键盘项在下次弹出键盘时生效。

# ── 与电脑版相同 ─────────────────────────────────────────────

[[page]]
id = "schema"
title = "方案"
segment = "shared"

[[page]]
id = "input"
title = "输入"
segment = "shared"

[[page]]
id = "ui"
title = "外观"
segment = "shared"

[[page]]
id = "stats"
title = "统计"
segment = "shared"

# ── 手机键盘（安卓专属）──────────────────────────────────────

[[page]]
id = "keyboard"
title = "键盘布局"
segment = "android"

[[page]]
id = "keys"
title = "按键与手势"
segment = "android"

[[page]]
id = "toolbar"
title = "工具栏与剪贴板"
segment = "android"

# ── 收尾 ─────────────────────────────────────────────────────

[[page]]
id = "advanced"
title = "高级"
segment = "tail"

[[page]]
id = "about"
title = "关于"
segment = "tail"

