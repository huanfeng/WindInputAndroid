# 设置清单：驱动设置页生成（方法论同桌面 wind-setting 的 settings_manifest）。
#
# [[group]]        分组，title 为组标题
# [[group.item]]   设置项：
#   key      配置键（点分路径，写入用户层 config.toml，与桌面配置域对齐）
#   type     toggle（后续扩展：select/number/action）
#   title    标题
#   summary  说明（可选）
#   default  默认值
#   platform 平台门控（可选；"android" = 仅安卓，缺省 = 通用）
#
# 占位清单：Rust 核心接入后，通用逻辑域设置项(schema/input/keys)将与桌面清单合并。

[[group]]
title = "键盘"

[[group.item]]
key = "ui.android.haptic"
type = "toggle"
title = "按键震动"
summary = "点按键盘时的触觉反馈"
default = true
platform = "android"

[[group.item]]
key = "ui.android.key_preview"
type = "toggle"
title = "按键气泡"
summary = "点按时显示按键放大气泡"
default = false
platform = "android"

[[group.item]]
key = "ui.android.row_height_portrait"
type = "int"
title = "键高（竖屏）"
summary = "单行键位高度，dp"
default = 56
min = 40
max = 72
step = 2
platform = "android"

[[group.item]]
key = "ui.android.row_height_landscape"
type = "int"
title = "键高（横屏）"
summary = "单行键位高度，dp"
default = 44
min = 36
max = 64
step = 2
platform = "android"

[[group.item]]
key = "ui.android.sound"
type = "toggle"
title = "按键音"
summary = "点按键盘时播放系统按键音，音量随系统触摸音量"
default = false
platform = "android"

[[group.item]]
key = "ui.android.long_press_delay"
type = "int"
title = "长按判定时长"
summary = "按住多久算长按（弹出符号气泡 / 开始连删），毫秒"
default = 300
min = 150
max = 600
step = 50
platform = "android"

[[group]]
title = "外观"

[[group.item]]
key = "ui.android.theme"
type = "select"
title = "深浅色"
summary = "键盘配色"
default = "system"
options = [
  { value = "system", label = "跟随系统" },
  { value = "light", label = "浅色" },
  { value = "dark", label = "深色" },
]
platform = "android"

[[group.item]]
key = "ui.android.candidate_text_sp"
type = "int"
title = "候选字号"
summary = "候选栏文字大小，sp"
default = 19
min = 15
max = 24
step = 1
platform = "android"

[[group]]
title = "手势"

[[group.item]]
key = "ui.android.gesture_space_cursor"
type = "toggle"
title = "空格左右滑动移光标"
default = true
platform = "android"

[[group.item]]
key = "ui.android.gesture_backspace_select"
type = "toggle"
title = "退格左滑批量删除"
summary = "有编码时清空编码，没有编码时选中并删除光标前的文字"
default = true
platform = "android"

[[group.item]]
key = "ui.android.gesture_swipe_symbols"
type = "toggle"
title = "字母键上滑出符号"
summary = "关闭后仅长按可出副字符"
default = true
platform = "android"

[[group]]
title = "候选与剪贴板"

[[group.item]]
key = "ui.android.inline_preedit"
type = "toggle"
title = "编码嵌入输入框"
summary = "打字时把编码同时显示在输入框里（默认只在编码栏显示）"
default = false
platform = "android"

[[group.item]]
key = "ui.android.clip_suggestion"
type = "toggle"
title = "复制后提示粘贴"
summary = "复制新内容后在候选栏位置显示一条粘贴建议，30 秒后自动消失"
default = true
platform = "android"
