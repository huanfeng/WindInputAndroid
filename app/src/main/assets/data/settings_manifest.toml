# ═══ 方案设置表单（每个方案的设置页；代码按方案类型取 schemes 匹配的项）═══════════
# section = 分组（方案设置页里一组一个子页）；schemes = 适用的方案类型
# （pinyin / shuangpin / codetable / mixed / english）。键是旧全局键名 schema.<类型>.<项>，
# 值经核心 scheme_form 按方案读写（与电脑版 schema.getSettings 同口径），不走全局配置。

[[item]]
page = "scheme_form"
section = "基本"
schemes = ["shuangpin"]
key = "schema.pinyin.shuangpin.allow_full_pinyin"
source = "engine"
type = "toggle"
title = "双拼时允许全拼输入"
summary = "双拼方案下也能按全拼打字"
detail = "如打 zaijian 出「再见」。"

[[item]]
page = "scheme_form"
section = "基本"
schemes = ["pinyin", "shuangpin"]
key = "schema.pinyin.single_char"
source = "engine"
type = "toggle"
title = "单字输入"
summary = "候选只出单字，不出词组"

[[item]]
page = "scheme_form"
section = "基本"
schemes = ["pinyin", "shuangpin"]
key = "schema.pinyin.abbrev.enabled"
source = "engine"
type = "toggle"
title = "启用简拼"
summary = "只打声母也能出词"
detail = "如 nh → 你好、bzd → 不知道，也可与全拼混打（nhao）。"

[[item]]
page = "scheme_form"
section = "基本"
schemes = ["pinyin", "shuangpin"]
key = "schema.pinyin.separator"
source = "engine"
type = "select"
title = "拼音分隔符"
summary = "手动切开音节用的符号"
detail = "如输入 xi'an 得到「西安」。「自动」默认用 '，' 被选择键占用时改用 `。"
options = [
  { value = "auto", label = "自动" },
  { value = "quote", label = "单引号 '" },
  { value = "backtick", label = "反引号 `" },
  { value = "none", label = "不使用" },
]

# 九宫格键盘组：「启用九宫格键盘布局」开关与九宫格标点由代码画（键盘配置 ui.android.t9.*，不按方案存），
